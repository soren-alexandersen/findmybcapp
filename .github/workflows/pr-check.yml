# Robot 1 of 2: checks publisher pull requests. Runs with read-only access and no secrets,
# so it is safe even on code from forks. It cannot comment: it saves its result as an
# artifact, and pr-comment.yml (robot 2) posts it.
# GitHub asks a maintainer to click "Approve and run" for first-time contributors.
name: Publisher PR check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["publisher-data/**"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # The site owner's own PRs (catalog refreshes, site changes) are checked by data-check.yml instead.
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch (rules and script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out the pull request (data)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "jsonschema>=4.18"

      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | [.status, .filename] | @tsv' > files.tsv
          cat files.tsv

      - name: Check
        id: check
        continue-on-error: true
        run: |
          mkdir -p result
          python base/scripts/pr_check.py --base base --pr pr --files files.tsv --out result/comment.md

      - name: Save the result for robot 2
        if: always()
        run: |
          mkdir -p result
          [ -s result/comment.md ] || echo "The check could not run. See the Actions log." > result/comment.md
          echo "${{ steps.check.outcome }}" > result/outcome.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-check-result
          path: result/
          retention-days: 7

      - name: Fail when the file needs changes
        if: steps.check.outcome == 'failure'
        run: exit 1
